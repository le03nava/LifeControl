name: Gateway CI

# Both Java builds resolve from the shared version catalog at the repository root
# (`gradle/libs.versions.toml`, issue #894). It matches no module path, so it is listed in both
# triggers: a catalog-only version bump changes what both modules build, and without this entry
# it would start no run at all.
on:
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'
      - 'gradle/libs.versions.toml'
      - 'life-control-api/src/main/java/**/controller/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'api-gateway/**'
      - 'gradle/libs.versions.toml'
      # The guard reads API @RequestMapping prefixes, so a new API
      # prefix must re-run this workflow even if the gateway is untouched.
      - 'life-control-api/src/main/java/**/controller/**'
      - '.github/workflows/gateway-ci.yml'

# Read-only, declared instead of inherited: nothing in this workflow writes, and an inherited
# default token would be a write-capable credential handed to every action in the job. The artifact
# upload authenticates with the run's runtime token, not with a GITHUB_TOKEN scope.
permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gateway-test-results
          path: api-gateway/build/reports/tests/test
          if-no-files-found: warn
