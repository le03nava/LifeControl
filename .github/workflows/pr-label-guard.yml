name: PR Label Guard

# Two gates run here, because both answer "is this pull request allowed to merge?" from data
# the event already carries, and both are cheap:
#
#   1. `guard` — every pull request carries exactly one `type:*` label, from the vocabulary the
#      machine-installed `branch-pr` skill declares and this repository mirrors in
#      `.agents/skills/project-conventions/references/labels.md`.
#   2. `issue` — the body references an open issue carrying `status:approved`, which is what the
#      PR template declares as REQUIRED and what `references/labels.md` states as invariant 4.
#      Before this job existed the link was a review-time convention: 55 of the last 60 merged
#      pull requests carried no reference at all.
#
# There is deliberately NO `paths:` filter here. The other four workflows all nest one
# under `pull_request`, which is why a markdown-only PR runs zero jobs in this
# repository; measuring that was what made the label rule review-time only. A filter
# would blind this gate exactly where the rule is used most — 80 of the 341 merged PRs
# are `docs`-prefixed — so the rule is enforced for every PR and the cost is one short
# job. The same reasoning is recorded in `references/labels.md`.
#
# `labeled` and `unlabeled` are part of the trigger set so that adding the missing label
# clears the check without pushing an empty commit; `edited` is there because the issue gate
# in this same workflow reads the pull request body, so editing the body has to re-run it.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read
  # The issue gate reads the referenced issue through this token, and the label gate reads the
  # pull request's own label set: read-only, and the only scopes this workflow adds. Nothing here
  # writes anything.
  issues: read
  pull-requests: read

concurrency:
  group: pr-label-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Exactly one type:* label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ShellCheck
        shell: bash
        run: |
          mapfile -t scripts < <(find .github/scripts -type f -name '*.sh' | sort)
          printf 'Checking %d script(s)\n' "${#scripts[@]}"
          # Same pinned image as docker-build-integrity.yml, so the verdict does not
          # drift with the runner image.
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --severity=warning "${scripts[@]}"

      - name: Self-tests
        run: |
          # Every suite under .github/scripts/tests, so a new one is wired by existing
          # rather than by remembering to add a step. The guard's own four failure modes,
          # the planner's mapping and idempotency, and the wiring between the template and
          # the vocabulary are all offline: no network, no `gh`, no token.
          for suite in .github/scripts/tests/*.test.sh; do
            printf '\n== %s\n' "$suite"
            "$suite"
          done

      - name: Exactly one type:* label
        # The label set is read from the pull request **as it is when the job runs**, never from the
        # trigger payload. The payload is a snapshot taken when the event fired: Dependabot applies
        # its labels a beat later, so the snapshot can legitimately carry `[]`, and
        # `cancel-in-progress` can leave the run holding it as the only survivor — a failure the pull
        # request does not have, and one no rerun can clear, because a rerun replays the stored
        # payload. Measured on pull request #392: the failing run executed 14 seconds after
        # `["type:chore","dependencies"]` existed, and still saw `[]`.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')"
          .github/scripts/check-pr-type-labels.sh --labels-json "$labels"

  issue:
    name: A linked, approved issue
    # A Dependabot bump is opened by a machine that cannot author an approved issue and cannot
    # edit its own pull request body, and the weekly dependency policy is its approval model.
    # Every human-authored pull request goes through this gate.
    #
    # The predicate is who AUTHORED the pull request, never who triggered the event. Measured on
    # pull request #392 (2026-10-17): a maintainer toggling one label made `github.actor` the human,
    # the job ran, and a dependency bump failed a gate it is exempt from. `label-artifacts.test.sh`
    # fails if this comparison is ever simplified back to the actor.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reference an open, approved issue
        env:
          # Event data reaches the script through the environment, never interpolated into
          # the script text.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Mode 1 prints the numbers this pull request references and exits non-zero with the
          # reason when there is nothing usable, so the gate itself never calls the network:
          # every rule stays covered offline by .github/scripts/tests/check-issue-reference.test.sh,
          # which the Self-tests step of the guard job already runs.
          refs="$(.github/scripts/check-issue-reference.sh \
            --body "$PR_BODY" \
            --base-branch "$BASE_BRANCH" \
            --default-branch "$DEFAULT_BRANCH" \
            --print-refs)"

          issues='[]'
          for number in $refs; do
            if ! fetched="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}" 2>/dev/null)"; then
              printf 'FAIL: #%s could not be read as an issue of %s\n' "$number" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
            issues="$(jq -c --argjson fetched "$fetched" '. + [$fetched]' <<<"$issues")"
          done

          .github/scripts/check-issue-reference.sh \
            --body "$PR_BODY" \
            --base-branch "$BASE_BRANCH" \
            --default-branch "$DEFAULT_BRANCH" \
            --issues-json "$issues"
