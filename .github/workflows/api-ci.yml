name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'life-control-api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'life-control-api/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

# Two jobs rather than two steps of one job: inside a single job the test step does not start
# until static analysis has finished, so the two gates cannot overlap and the run costs the sum of
# both. As separate jobs they start together, so the run costs the slower gate. Each job repeats
# Checkout and Setup Java because a job cannot read another job's workspace or JDK.
jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-control-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Static analysis
        run: ./gradlew spotlessCheck spotbugsMain --no-daemon

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-control-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: life-control-api/build/reports/tests/test
          if-no-files-found: warn
