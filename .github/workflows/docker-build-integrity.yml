name: Docker Build Integrity

# Both Java builds resolve from the shared version catalog at the repository root
# (`gradle/libs.versions.toml`, issue #894). It matches no module path, so it is listed in both
# triggers: a catalog-only version bump changes what both modules build, and without this entry
# it would start no run at all.
on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'api-gateway/Dockerfile'
      - 'api-gateway/build.gradle'
      - 'life-control-api/Dockerfile'
      - 'life-control-api/build.gradle'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docker-build-integrity.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'api-gateway/Dockerfile'
      - 'api-gateway/build.gradle'
      - 'life-control-api/Dockerfile'
      - 'life-control-api/build.gradle'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docker-build-integrity.yml'

# Read-only, declared instead of inherited: this job reads the checkout and runs containers from it,
# and writes nothing back to the repository.
permissions:
  contents: read

concurrency:
  group: docker-build-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Shell & Artifact Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck
        shell: bash
        run: |
          mapfile -t scripts < <(find docker/scripts -type f -name '*.sh' | sort)
          printf 'Checking %d script(s)\n' "${#scripts[@]}"
          # Pinned container image so the verdict does not drift with the runner image, and so it
          # matches the version used locally. It used to be `koalaman/shellcheck:stable`, which is a
          # floating alias: the linter that gates this repository could change without a commit.
          # .github/scripts/tests/workflow-pins.test.sh freezes the tag below.
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            --severity=warning "${scripts[@]}"

      # Every suite, by glob. This used to name five of them explicitly, so a suite added to the
      # directory ran locally and never in CI -- measured on the observability unit, whose four new
      # suites (deploy-health probes, Loki retention, port binding, Grafana provisioning) would have
      # been invisible to this job. A suite is wired by existing, and the run prints how many ran so
      # a glob that quietly matches nothing is visible instead of green.
      - name: Docker script suites
        shell: bash
        run: |
          mapfile -t suites < <(find docker/scripts/tests -type f -name '*.test.sh' | sort)
          printf 'Running %d suite(s)\n' "${#suites[@]}"
          [ "${#suites[@]}" -gt 0 ] || { echo "no suite matched docker/scripts/tests/*.test.sh" >&2; exit 1; }
          for suite in "${suites[@]}"; do
            printf '\n=== %s ===\n' "$suite"
            "$suite"
          done
