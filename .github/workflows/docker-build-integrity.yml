name: Docker Build Integrity

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'api-gateway/Dockerfile'
      - 'api-gateway/build.gradle'
      - 'life-control-api/Dockerfile'
      - 'life-control-api/build.gradle'
      - '.github/workflows/docker-build-integrity.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'api-gateway/Dockerfile'
      - 'api-gateway/build.gradle'
      - 'life-control-api/Dockerfile'
      - 'life-control-api/build.gradle'
      - '.github/workflows/docker-build-integrity.yml'

concurrency:
  group: docker-build-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Shell & Artifact Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ShellCheck
        shell: bash
        run: |
          mapfile -t scripts < <(find docker/scripts -type f -name '*.sh' | sort)
          printf 'Checking %d script(s)\n' "${#scripts[@]}"
          # Pinned container image so the verdict does not drift with the runner
          # image, and so it matches the version used locally.
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --severity=warning "${scripts[@]}"

      # Every suite, by glob. This used to name five of them explicitly, so a suite added to the
      # directory ran locally and never in CI -- measured on the observability unit, whose four new
      # suites (deploy-health probes, Loki retention, port binding, Grafana provisioning) would have
      # been invisible to this job. A suite is wired by existing, and the run prints how many ran so
      # a glob that quietly matches nothing is visible instead of green.
      - name: Docker script suites
        shell: bash
        run: |
          mapfile -t suites < <(find docker/scripts/tests -type f -name '*.test.sh' | sort)
          printf 'Running %d suite(s)\n' "${#suites[@]}"
          [ "${#suites[@]}" -gt 0 ] || { echo "no suite matched docker/scripts/tests/*.test.sh" >&2; exit 1; }
          for suite in "${suites[@]}"; do
            printf '\n=== %s ===\n' "$suite"
            "$suite"
          done
