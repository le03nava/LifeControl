version: 2
updates:
  - package-ecosystem: gradle
    directory: /life-control-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Dependabot cannot author the approved issue the `issue` gate needs, and it cannot edit
    # its own labels after opening, so these two labels at open time are what let its pull
    # requests satisfy `.github/scripts/check-pr-type-labels.sh`. `dependencies` is the
    # Dependabot-created triage label; `type:chore` is the `type:*` name the guard accepts.
    # `label-artifacts.test.sh` fails if any `updates[]` entry drops or doubles them.
    labels:
      - dependencies
      - type:chore

  # The gateway is a second Gradle build — its own wrapper, its own `build.gradle`, the same
  # version catalog — and until this entry existed nobody updated it. That was not only
  # staleness, it made the bumps the bot *did* open unmergeable: `gradle-pins.test.sh` freezes
  # the wrapper PAIR and asserts both modules print the same `distributionUrl`, so a bump
  # proposed for one module alone fails that suite, the guard job aborts at `Self-tests` before
  # the label check runs, and the required `Exactly one type:* label` context reports a label
  # failure for a pull request whose labels are right (measured on #935, issue #984).
  #
  # The labels are the same two as the entry above, for the reason stated there: every
  # `updates[]` entry is checked on its own and one without them fails the guard.
  - package-ecosystem: gradle
    directory: /api-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - type:chore

  # The Angular application: 27 direct dependencies, `package-lock.json`, Node from `.nvmrc`.
  # Nothing watched it before this entry (issue #985).
  #
  # Two shapes here are easy to get wrong, and both fail closed into "no pull requests at all"
  # rather than into an error anyone sees in CI, because nothing in this repository validates
  # the schema of this file:
  #
  #   * `update-types` speaks two different vocabularies. Under `ignore` the values are
  #     `version-update:semver-*`; under `groups` they are the bare `major`/`minor`/`patch`.
  #     Mixing them is an invalid config.
  #   * A group only holds what its `patterns` match, so the catch-all group has to exclude the
  #     Angular line explicitly, or the two groups overlap and Dependabot rejects the entry.
  #
  # The Angular major line moves by its own migration (`ng update`, with its codemods and its
  # changelog), never by a bot pull request, so majors of `@angular/*` are ignored here rather
  # than grouped: a grouped major would arrive as one more approval away from a broken build.
  - package-ecosystem: npm
    directory: /life-control-app-angular
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major
    # One pull request per group instead of one per package: 27 dependencies on a weekly
    # schedule is 27 pull requests, and `open-pull-requests-limit: 5` would then hide most of
    # them behind the limit rather than slow them down.
    groups:
      angular:
        patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch
      everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - type:chore
