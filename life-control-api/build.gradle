plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'com.github.spotbugs' version '6.5.13'
}

group = 'com.lifecontrol'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

spotless {
    java {
        palantirJavaFormat('2.98.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

spotbugs {
    toolVersion = '4.9.8'
    effort.set(com.github.spotbugs.snom.Effort.MAX)
    reportLevel.set(com.github.spotbugs.snom.Confidence.valueOf('MEDIUM'))
    ignoreFailures = false
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

// Static analysis is scoped to production code: test sources are intentionally noisy
// (dead stores, unread fields, format strings) and out of this baseline's scope.
tasks.named('spotbugsTest') {
    enabled = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.github.loki4j:loki-logback-appender:1.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'org.zalando:logbook-spring-boot-starter:4.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.keycloak:keycloak-admin-client:26.0.12'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc:4.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
    // 1 GB, and the number is measured, not preferred. The default 512 MB fork dies with
    // `java.lang.OutOfMemoryError` part-way through the suite: observed on CI for PR #711
    // (`SuiteTestDefinitionProcessor`, before any assertion) and locally afterwards, where the run
    // stopped after 1 903 of 4 240 tests. The suite caches one Spring context and one Hikari pool per
    // distinct `@SpringBootTest` configuration, so the heap it needs grows with the number of
    // configurations rather than with the code under test — which is also why the server accepts 300
    // connections (see AbstractPostgresIntegrationTest). A gate that OOMs one run in three is not a gate.
    maxHeapSize = '1g'
    // The application's own `spring.profiles.active` defaults to `dev`, and the Logbook
    // fail-closed profile guard refuses to start on that default unless SPRING_PROFILES_ACTIVE
    // is declared. The suite is not a deployment, so it declares its own profile here instead
    // of inheriting `dev` by accident from the main application.properties.
    systemProperty 'spring.profiles.active', 'test'
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}
