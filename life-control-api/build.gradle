plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.asciidoctor.jvm.convert)
    alias(libs.plugins.spotless)
    alias(libs.plugins.spotbugs)
}

group = 'com.lifecontrol'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

spotless {
    java {
        palantirJavaFormat(libs.versions.palantir.java.format.get())
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

spotbugs {
    toolVersion = libs.versions.spotbugs.tool.get()
    effort.set(com.github.spotbugs.snom.Effort.MAX)
    reportLevel.set(com.github.spotbugs.snom.Confidence.valueOf('MEDIUM'))
    ignoreFailures = false
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

// Static analysis is scoped to production code: test sources are intentionally noisy
// (dead stores, unread fields, format strings) and out of this baseline's scope.
tasks.named('spotbugsTest') {
    enabled = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    implementation libs.springdoc.openapi.starter.webmvc.ui
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation libs.loki.logback.appender
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation libs.bucket4j.core
    implementation libs.logbook.spring.boot.starter
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation libs.keycloak.admin.client
    // The SAT's `cadenaoriginal_4_0.xslt` declares version="2.0". The JDK's built-in transformer is XSLT 1.0
    // only, and it does not refuse a 2.0 stylesheet: it runs it with 1.0 semantics and answers a different
    // `cadena original`, which signs into a document the authority rejects while looking correct. Saxon-HE is
    // Mozilla Public License 2.0 — file-level copyleft, no obligation on this tree's own sources — and carries
    // `org.xmlresolver:xmlresolver` transitively.
    implementation libs.saxon.he
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'com.h2database:h2'
    testImplementation libs.springdoc.openapi.starter.webmvc.api
    testImplementation libs.spring.restdocs.mockmvc
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
    // 1 GB, and the number is measured, not preferred. The default 512 MB fork dies with
    // `java.lang.OutOfMemoryError` part-way through the suite: observed on CI for PR #711
    // (`SuiteTestDefinitionProcessor`, before any assertion) and locally afterwards, where the run
    // stopped after 1 903 of 4 240 tests. The suite caches one Spring context and one Hikari pool per
    // distinct `@SpringBootTest` configuration, so the heap it needs grows with the number of
    // configurations rather than with the code under test — which is also why the server accepts 300
    // connections (see AbstractPostgresIntegrationTest). A gate that OOMs one run in three is not a gate.
    maxHeapSize = '1g'
    // The application's own `spring.profiles.active` defaults to `dev`, and the Logbook
    // fail-closed profile guard refuses to start on that default unless SPRING_PROFILES_ACTIVE
    // is declared. The suite is not a deployment, so it declares its own profile here instead
    // of inheriting `dev` by accident from the main application.properties.
    systemProperty 'spring.profiles.active', 'test'
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}
