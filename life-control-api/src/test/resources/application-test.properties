spring.application.name=lifecontrol-api-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never
# Default test stack: H2 with Flyway disabled. Integration tests that need real
# PostgreSQL semantics extend AbstractPostgresIntegrationTest, which overrides the
# datasource to a Testcontainers PostgreSQLContainer and re-enables Flyway.
spring.flyway.enabled=false
server.port=0

# Baseline at 0, and this is the line that lets the test container carry objects BEFORE Flyway runs.
#
# `application.properties` sets `baseline-on-migrate=true` with `baseline-version=1` for databases that
# already exist. The Testcontainers volume is fresh per JVM, but it is NOT empty when Flyway first runs:
# `withInitScript("test-container-roles.sql")` creates the tenant resolver
# `task_employee_company(uuid)` in `public` before the context starts, and Flyway reads a schema that
# holds any object as an existing database — so it baselines at 1, records `V1__baseline_schema.sql` as
# applied WITHOUT running it, and leaves the schema without a single table.
#
# Measured on 2026-11-01 against postgres:16-alpine: with the resolver in the init script and the
# production baseline pair, the first PostgreSQL context logs `Successfully baselined schema with
# version: 1` and then fails migrating `V2__seed_countries.sql` with `SQL State 42P01: relation
# "countries" does not exist` — a symptom that names neither Flyway nor the fixture, and the reason
# somebody will otherwise "fix" this line back.
#
# Baseline at 0 is the only true statement about a database the suite owns and just created: nothing is
# applied yet, so apply everything. It changes nothing for an empty container (the baseline does not
# trigger there), and it is what lets a future init script create objects before the migrations run.
spring.flyway.baseline-version=0

# Disable Loki logging in tests
loki.url=http://localhost:3100/loki/api/v1/push

# Disable tracing in tests
management.tracing.export.enabled=false

# Dummy value — tests never call the real Keycloak admin API
keycloak.admin.client-secret=test-secret

# Use simple in-memory cache for tests (no Redis required)
spring.cache.type=simple

# Exclude Redis auto-configuration (no Redis available in test environment). The class must be the
# one this Boot version provides: an exclusion naming a class nothing ships removes nothing and the
# auto-configuration stays active, which is what happened when the Boot 4 packages moved.
# TestAutoconfigureExclusionsTest fails if a name here leaves the classpath.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
