spring.application.name=lifecontrol-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://lifecontrol-postgres:5432/lifecontrol}
# Two logins, two jobs (ADR-0005, decision 3), and these five lines are the whole split:
#
#   * the pool reads DATABASE_USERNAME / DATABASE_PASSWORD and logs in as `lifecontrol_app`, which owns
#     nothing and carries no BYPASSRLS, so every ADR-0005 policy applies to the connection the
#     application actually uses. Its credential is docker/secrets/lifecontrol_app_password.
#   * Flyway reads FLYWAY_USERNAME / FLYWAY_PASSWORD and logs in as `lifecontrol_owner`, the owner of
#     every object and therefore the only login allowed to run DDL. Its credential is
#     docker/secrets/lifecontrol_postgres_password, and it never reaches the pool.
#
# That Flyway migrates as the owner says nothing about what the runtime connections are: Boot builds
# Flyway's own connection from these three properties (url, user, password), so the two are separate
# logins on purpose. docker/entrypoints/lifecontrol-app-entrypoint.sh exports all four values, and
# docker/scripts/tests/app-credential-split.test.sh fails if either pair is swapped back.
spring.datasource.username=${DATABASE_USERNAME:lifecontrol_app}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.url=${DATABASE_URL:jdbc:postgresql://lifecontrol-postgres:5432/lifecontrol}
spring.flyway.user=${FLYWAY_USERNAME:lifecontrol_owner}
# Empty default on purpose: outside the container (unit tests, `bootRun`) Flyway is disabled or the
# caller supplies its own credential. In delivery the wrapper refuses to start without the owner secret,
# and an empty password cannot authenticate over scram-sha-256, so a missing split fails loudly instead
# of migrating as the wrong role.
spring.flyway.password=${FLYWAY_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Hibernate JDBC batching — all entities use GenerationType.UUID (app-generated
# keys), so inserts/updates can be grouped into batches at flush time.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Read-side hint: PostgreSQL uses a server-side cursor for large result sets
# (aligned with the capped page size of 100)
spring.jpa.properties.hibernate.jdbc.fetch_size=100

spring.sql.init.mode=never
# Baseline at version 0, for the same reason `application-test.properties` records: a database this
# project creates from scratch is NOT empty when Flyway first reaches it.
# `docker/postgres-init/lifecontrol-roles.sql` runs while the postgres image boots, before the API
# exists, and creates `task_employee_company(uuid)` in `public` (step 6). Flyway treats a schema holding
# any non-extension object as a database that predates it, so at baseline version 1 it recorded
# `V1__baseline_schema.sql` as applied WITHOUT running it and the next migration died with
# `SQL State 42P01: relation "countries" does not exist` — every fresh volume failed to initialize: a
# dev datadir after a reset, a new staging, a first production install. The `btree_gist` extension the
# same script creates is excluded from that check because its objects belong to the extension; the
# resolver function is not. Issue #722 holds the measurement on a real datadir.
#
# `baseline-on-migrate=true` keeps its other job: without it Flyway refuses a schema that already holds
# objects ("Found non-empty schema(s) but no schema history table") instead of initializing it. What it
# must not do is claim a migration ran.
#
# Version 0 is the only true statement about a schema that holds no tables. The single case version 1
# existed for — a database seeded before Flyway did — is now an explicit operator action:
# `flyway baseline -baselineVersion=1`, run once, on purpose. Pinned by
# `FlywayDeliveryBaselineIntegrationTest`, which reads these two lines from the classpath instead of
# restating them, so the suite and delivery cannot disagree again.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8082}

# Jackson 3 request-body strictness. Boot 4 leaves Jackson 3's own default
# (FAIL_ON_UNKNOWN_PROPERTIES=false), so an undeclared field in a request body was silently
# ignored. This restores the pre-migration accepted-request contract: such a body is rejected
# with 400, and nothing else about the Jackson 3 defaults changes.
spring.jackson.deserialization.fail-on-unknown-properties=true

# SQL and application logging levels live in profile-specific files:
# - application-dev.properties: DEBUG/TRACE (SQL logging enabled)
# - application-staging.properties: INFO
# - application-prod.properties: INFO/WARN
# Base defaults to off so no query parameter data reaches logs by default.

# Redis Configuration (used by Spring Cache)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# The cache requires a password, and it arrives from docker/entrypoints/lifecontrol-app-entrypoint.sh,
# which reads docker/secrets/redis_password and exports it. It is deliberately NOT a compose environment
# entry: an environment value is a value in `docker inspect` and in `docker compose config` (issue #890).
# Empty outside a container, which is the state a local run with a passwordless Redis needs.
spring.data.redis.password=${REDIS_PASSWORD:}

# Bound how long a cached read waits for Redis. Left unset, Lettuce waits its 60s default, and an
# unreachable Redis made every cached read answer 500 after a minute instead of failing fast.
spring.data.redis.timeout=2s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,prometheus

# Keep Redis out of /actuator/health, which is what the container healthcheck reads. Only the eight
# cache regions need Redis, so with the indicator on a Redis outage marks the whole service down and
# takes the endpoints that never read the cache with it. The signal moves to the log and to the
# failing reads; see the Caching section of AGENTS.md.
management.health.redis.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=lifecontrol-api
management.tracing.export.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# The OpenTelemetry starter also enables an OTLP metrics exporter and an OTLP log exporter by
# default. Those pipelines did not exist before the migration (metrics go to Prometheus, logs to
# Loki), so keep OTLP traces only. Names verified against the 4.1.1 artifacts: metrics in
# spring-boot-micrometer-metrics, logs in spring-boot-opentelemetry (the Boot 3 spelling
# management.otlp.logging.export.enabled is deprecated since 4.0.0).
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# Cap client-supplied page sizes to prevent oversized queries
spring.data.web.pageable.max-page-size=100

# Security — trusted proxies whose forwarded headers may be honored, and the
# internal addresses allowed to reach actuator endpoints such as /actuator/prometheus.
#
# Loopback only, and that is the whole default: a private range is not a proxy declaration, it is a
# network, and trusting it made every LAN host able to write its own client address through
# X-Forwarded-For (issue #892). A deployment that really runs behind a proxy declares it — the same
# TRUSTED_PROXIES value feeds app.rate-limit.trusted-proxies below, so the rate-limit buckets and the
# audit trail resolve the client the same way the actuator gate does.
app.security.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1/32,::1/128}
# The key is `actuator-allowed-cidrs`, not `actuator.allowed-cidrs`: the field is `actuatorAllowedCidrs`
# and relaxed binding only fills it from the flat spelling. The nested one bound nothing in silence (issue
# #979), which stayed invisible while the field default and this file carried the same RFC1918 list.
app.security.actuator-allowed-cidrs=${ACTUATOR_ALLOWED_CIDRS:127.0.0.1/32,::1/128}

# Docs (/v3/api-docs, /swagger-ui.html, ...) are NOT public unless this says so: the API's own
# security chain reads it, mirroring the gateway's `security.docs-public`. true only on dev.
security.docs-public=${SECURITY_DOCS_PUBLIC:false}

loki.url=${LOKI_URL:http://loki:3100/loki/api/v1/push}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
# compose passes LOG_LEVEL to this service (docker-compose.yml), so without this line the level was
# whatever logback-spring.xml pinned and raising it needed a rebuild. Same shape as the gateway's.
logging.level.root=${LOG_LEVEL:INFO}

# Rate Limiting Configuration (Bucket4j)
app.rate-limit.enabled=true
app.rate-limit.internal-ip-whitelist=127.0.0.1,::1
# Which forwarded hops the rate limiter believes. This key was set nowhere before issue #892, so the
# Java default was always in force; it is now the same operator knob as app.security.trusted-proxies.
app.rate-limit.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1/32,::1/128}
app.rate-limit.endpoints./api/users-admin/users.max-requests=60
app.rate-limit.endpoints./api/users-admin/users.duration=1m
app.rate-limit.endpoints./api/users-admin/login.max-requests=10
app.rate-limit.endpoints./api/users-admin/login.duration=1m
app.rate-limit.endpoints./api/users-admin/roles.max-requests=30
app.rate-limit.endpoints./api/users-admin/roles.duration=1m

# Logbook Configuration (request/response logging)
# `logbook.enabled` is read by LogbookConfig (@ConditionalOnProperty). What Logbook emits is
# decided by that class's `logbookStrategy` bean — every exchange on the `dev` profile, only a
# status >= 400 on every other profile — and whether any of it reaches the log is decided by the
# `org.zalando.logbook.Logbook` logger level in logback-spring.xml, which is where Logbook's
# TRACE writer is enabled. The body the log can carry is profile-split too: outside `dev`
# `SensitiveDataSanitizer.bodyFilter()` answers the fixed `[REDACTED]` instead of the body, so no
# request or response content is emitted whatever its content type; only on `dev` does the
# partial field-level JSON filter apply. `spring.profiles.active` above still resolves `dev` when
# SPRING_PROFILES_ACTIVE is absent, but that is no longer reachable: `LogbookProfileGuard`
# (registered in META-INF/spring.factories) refuses to start when the effective profile is `dev`
# and the variable was never declared, naming it. So a `dev` run is always explicit — compose
# requires the variable (docker/docker-compose.yml, `:?`) and neither image bakes a profile
# default (life-control-api/Dockerfile), so a deployment that does not declare it fails to start
# instead of falling back to `dev`. The k8s manifests declare no profile at all yet and the
# cluster has no environment overlay, so there the refusal above is the protection. The
# starter's own `logbook.strategy` / `logbook.write.status-code-based` properties bind to its
# auto-configured `Logbook`, and this application defines that bean itself, so they are inert
# here. A `logbook.log-strategy=status-only` line used to live here. No such property exists in
# Logbook (checked against 3.12.3 and 4.2.0), so it never configured anything.
logbook.enabled=true

# Keycloak Configuration
keycloak.uri=${KEYCLOAK_URI:http://lifecontrol-dev-keycloak:8080/realms/life-control-realm}
keycloak.issuer=${KEYCLOAK_ISSUER:${keycloak.uri}}
keycloak.jwk-set-uri=${keycloak.uri}/protocol/openid-connect/certs
# Accepted JWT issuers (allowlist). Defaults to the public issuer used by the browser
# (KEYCLOAK_ISSUER_URI) plus the internal issuer reached from within the Docker network.
keycloak.allowed-issuers=${KEYCLOAK_ALLOWED_ISSUERS:${KEYCLOAK_ISSUER_URI:${keycloak.issuer}},${keycloak.uri}}

# Keycloak Admin Client Configuration (identity provider)
keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:http://lifecontrol-dev-keycloak:8080}
keycloak.admin.realm=life-control-realm
keycloak.admin.client-id=life-control-admin-client
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Keycloak Application Client Configuration (the public client the SPA authenticates against)
# Same env name and default as docker/scripts/keycloak-setup.sh, so the platform has one name.
keycloak.app.client-id=${KEYCLOAK_CLIENT_ID:life-control-client}

# Account Invitation Configuration (the activation email sent by the access-provisioning flow)
# The redirect is the app's own public origin — NOT Keycloak's host — and is mandatory material for
# the actions email (record T21). Same env name as docker/.env.template's WEB_APP_URL.
app.invitation.redirect-uri=${WEB_APP_URL:http://localhost:4200}
app.invitation.lifespan-seconds=${INVITATION_LIFESPAN_SECONDS:43200}

# Access-Provisioning Worker Configuration (the scheduled pass that advances provisioning)
# `enabled` defaults to false: the worker mutates another system, so an unset value means disabled
# rather than live. Units live in the property names (`-seconds`), so a bare number is never
# milliseconds. Only max-attempts / base-delay-seconds / max-delay-seconds have a consumer today
# (the WorkerRetryPolicy bean); the other four are consumed by the scheduler in the next unit.
app.provisioning.worker.enabled=${WORKER_ENABLED:false}
app.provisioning.worker.interval-seconds=${WORKER_INTERVAL_SECONDS:60}
app.provisioning.worker.max-attempts=${WORKER_MAX_ATTEMPTS:5}
app.provisioning.worker.batch-size=${WORKER_BATCH_SIZE:20}
app.provisioning.worker.base-delay-seconds=${WORKER_BASE_DELAY_SECONDS:30}
app.provisioning.worker.max-delay-seconds=${WORKER_MAX_DELAY_SECONDS:3600}
# The staleness threshold defaults to 900 s (15x the 60 s interval). It is argued, not measured: the
# threshold has to sit above the worst real tick -- one run that calls three Keycloak-touching
# services -- because a threshold below a live run lets the worker steal its own row and execute it
# twice. 900 s buys that margin while bounding how long a stranded RUNNING row blocks that person.
app.provisioning.worker.staleness-threshold-seconds=${WORKER_STALENESS_THRESHOLD_SECONDS:900}

# Fiscal Document Configuration (the zone a stamp renders the document's `Fecha` in)
# The authority's `Fecha` carries no offset, so a stamp renders an instant in one zone; the tree has no
# company-level timezone to render it in, and that limit is named in the record (L12(c) of
# odd/tasks/cfdi-fiscal-document.md). The value is validated at startup by config.fiscal.FiscalConfig, so a
# misspelled zone fails the boot instead of the first stamp of the day.
app.fiscal.timezone=${FISCAL_TIMEZONE:America/Mexico_City}

# Stamping provider (T7, L18 of odd/tasks/cfdi-fiscal-document.md)
# `enabled` is the one switch that registers the adapter and the sealing pipeline behind the port T6 opened.
# An installation that does not invoice keeps the default and starts exactly as it did before, and a stamp
# answers the named refusal it already answers. Turning it on makes every value below REQUIRED at boot.
#
# None of them has a working default on purpose. The provider documents a public test account, which is
# precisely why a silent fallback to it would be reachable by accident and would send a tenant's document to a
# sandbox; and a defaulted endpoint would point a production install at the testing host, where the stamp is
# refused (633) after the XML has already left this process.
app.fiscal.provider.enabled=${FISCAL_PROVIDER_ENABLED:false}
app.fiscal.provider.solucion-factible.endpoint=${FISCAL_SF_ENDPOINT:}
app.fiscal.provider.solucion-factible.usuario=${FISCAL_SF_USUARIO:}
app.fiscal.provider.solucion-factible.password=${FISCAL_SF_PASSWORD:}
# A hung PAC would otherwise hold the stamp's transaction open for as long as the socket lives.
app.fiscal.provider.solucion-factible.timeout-seconds=${FISCAL_SF_TIMEOUT_SECONDS:30}

# The issuer's certificate and private key, which is what makes the seal ours (T7, L18(b) of the same record)
# `certificado` is the DER of the CSD in base64 and `llave` its private key as PKCS#8 in base64, optionally
# password-protected. A SAT `.key` container is the operator's `openssl pkcs8` step: no CSD exists in this
# repository to prove a container reader against, so the record states that limit instead of hiding it.
app.fiscal.csd.certificado=${FISCAL_CSD_CERTIFICADO:}
app.fiscal.csd.llave=${FISCAL_CSD_LLAVE:}
app.fiscal.csd.password=${FISCAL_CSD_PASSWORD:}
