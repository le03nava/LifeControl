# ============================================
# Staging profile overrides — SQL logging disabled
# ============================================

# Disable SQL logging in staging (no query parameter data in logs)
spring.jpa.show-sql=false

# Staging — INFO logging, no SQL/bind parameter logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.lifecontrol.api=INFO