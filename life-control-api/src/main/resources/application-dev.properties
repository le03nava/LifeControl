# ============================================
# Development profile overrides — verbose logging & SQL
# ============================================

# Show SQL statements with bound parameters (local development only)
spring.jpa.show-sql=true

# Verbose application logging for development
logging.level.com.lifecontrol.api.company=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.lifecontrol.api=DEBUG

# Redis local development (override via REDIS_HOST/REDIS_PORT env vars)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}