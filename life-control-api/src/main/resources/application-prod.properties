# ============================================
# Production profile overrides
# ============================================

# Production — disable SQL logging for security and performance
spring.jpa.show-sql=false

# Production — use Redis for caching (ensure REDIS_HOST and REDIS_PORT are set)
spring.cache.type=redis

# Production — reduce logging noise
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.lifecontrol.api=INFO

# Production — disable OpenAPI docs and Swagger UI (not exposed in prod)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Production — reduce distributed tracing sample rate to 10% by default, but let the deployment
# decide it. A profile file wins over application.properties, so a literal here silently replaced
# ${TRACING_SAMPLING_PROBABILITY:0.1} and docker/.env.prod's 0.01 never applied.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}