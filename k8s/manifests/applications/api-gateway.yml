apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # S2: the identity the published image declares (`Config.User: 1002:1000`), and the only one it
      # was ever read with. Nothing overrides it at the container level, so this pair is the effective
      # identity the suite compares against its measured table.
      securityContext:
        runAsUser: 1002
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: saiupadhyayula007/new-api-gateway:latest
          # IfNotPresent: `k8s/kind/kind-load.sh` loads this image into the node, and `:latest`
          # defaults to `Always`, which would try to pull it and fail offline.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # readOnlyRootFilesystem stays writable, and this is the one exception in the tree that is
            # not a measurement: the published image is arm64-only and exits
            # `exec /cnb/process/web: exec format error` on an amd64 host, so whether it tolerates a
            # read-only root filesystem could not be observed at all. Declaring `true` here would be a
            # claim nobody measured.
            readOnlyRootFilesystem: false
          # Laptop playground sizing: one replica on a kind node, so the request is a share of one
          # core and the limit only stops this workload from starving the other seven.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # No livenessProbe: it would have to prove the gateway recovers from a dependency that is
          # still starting (Keycloak on its first boot) without being restarted for it; readiness
          # already covers "not serving yet", which is the state that actually happens here.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          ports:
            - containerPort: 9000
          env:
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI
              valueFrom:
                configMapKeyRef:
                  key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI
                  name: api-gateway-config
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  key: LOKI_URL
                  name: common-config
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
                  name: common-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: "http://keycloak:8080/realms/spring-microservices-security-realm"