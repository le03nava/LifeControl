apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # S2: `65534:65534` is `nobody` in this image, and the uid the tree means when it says the
      # observability stack runs unprivileged. Nothing overrides it at the container level.
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.46.0
          # IfNotPresent: `k8s/kind/kind-load.sh` loads this image into the node, so this playground
          # never pulls.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Measured: with a read-only root filesystem Prometheus fails with
            # `Error opening query log file /prometheus/queries.active: read-only file system`. Its
            # data directory is `/prometheus`, so the tmpfs below is that path -- the image declares
            # it as a `VOLUME`, which docker gives an anonymous writable mount but Kubernetes does
            # not, so it has to be declared here or the TSDB has nowhere to open.
            readOnlyRootFilesystem: true
          # Laptop playground sizing: a 2s scrape over one target is close to idle, so the request is
          # small; the limit leaves room for a query burst without reserving it for the whole idle
          # playground.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          # No livenessProbe: the process is healthy while its TSDB replays the write-ahead log, and a
          # liveness check that failed during replay would restart it and lose the scrape history it
          # was recovering. A liveness probe would have to prove replay finished, not that it is fast.
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          ports:
            - containerPort: 9090
          args:
            - --enable-feature=exemplar-storage
            - --config.file=/etc/prometheus/prometheus.yml
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-configmap
        # The writable half of `readOnlyRootFilesystem: true`: the one path the read-only run named.
        # Memory, not disk, because a playground's scrape history is worth nothing across a restart.
        - name: prometheus-data
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s

    scrape_configs:
      - job_name: 'api-gateway'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['api-gateway:9000'] ## only for demo purposes don't use host.docker.internal in production
