# ============================================
# LifeControl - Tempo Configuration
# ============================================
# Installed by setup-env.sh into $VOLUMES_ROOT/tempo/config.
# Receives OTLP traces (both applications export through Micrometer Tracing/OTLP) and Zipkin;
# local trace storage.
#
# Every receiver declares its endpoint explicitly, and never on the loopback interface. Tempo 3.x
# hands an OTLP receiver declared without an `endpoint` to the OpenTelemetry Collector's default,
# which is `localhost`: the socket then exists only inside this container, both applications fail
# to export with `ConnectException: Connection refused` and the container still reports healthy.
# docker/scripts/tests/tempo-receivers.test.sh pins the three sockets below.
# ============================================
server:
  http_listen_port: 3100

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    zipkin:
      endpoint: 0.0.0.0:9411

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
