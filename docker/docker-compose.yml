# ============================================
# LifeControl - Docker Compose Parametrizado
# ============================================

# Network configuration - default bridge network
networks:
  default:
    driver: bridge

services:
  # ============================================
  # PostgreSQL - Keycloak Database
  # ============================================
  keycloak-postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-keycloak-postgres
    entrypoint: ["/usr/local/bin/lc-postgres-entrypoint.sh"]
    command: ["postgres"]
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      LC_SECRET_NAME: keycloak_postgres_password
    volumes:
      - ./entrypoints/postgres-entrypoint.sh:/usr/local/bin/lc-postgres-entrypoint.sh:ro
      - ./secrets/keycloak_postgres_password:/run/secrets/keycloak_postgres_password:ro
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/keycloak-postgres/data:/var/lib/postgresql
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_POSTGRES_USER:-keycloak}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # PostgreSQL - LifeControl API Database
  # ============================================
  lifecontrol-postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-lifecontrol-postgres
    entrypoint: ["/usr/local/bin/lc-postgres-entrypoint.sh"]
    command: ["postgres"]
    ports:
      - "${LIFECONTROL_POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${LIFECONTROL_POSTGRES_DB:-lifecontrol}
      POSTGRES_USER: ${LIFECONTROL_POSTGRES_USER:-lifecontrol_user}
      LC_SECRET_NAME: lifecontrol_postgres_password
    volumes:
      - ./entrypoints/postgres-entrypoint.sh:/usr/local/bin/lc-postgres-entrypoint.sh:ro
      - ./secrets/lifecontrol_postgres_password:/run/secrets/lifecontrol_postgres_password:ro
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/postgres/lifecontrol/data:/var/lib/postgresql
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: ${LIFECONTROL_POSTGRES_MEMORY_LIMIT:-256m}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LIFECONTROL_POSTGRES_USER:-lifecontrol_user}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # Keycloak - Identity Provider
  # ============================================
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1}
    entrypoint: ["/opt/keycloak/kc-entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8181}:8080"
    environment:
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://keycloak-postgres/keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HTTP_PORT: ${KC_HTTP_PORT:-8080}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
    volumes:
      - ./entrypoints/keycloak-entrypoint.sh:/opt/keycloak/kc-entrypoint.sh:ro
      - ./secrets/keycloak_postgres_password:/run/secrets/keycloak_postgres_password:ro
      - ./secrets/keycloak_admin_password:/run/secrets/keycloak_admin_password:ro
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/keycloak/realms:/opt/keycloak/data/import:ro
    networks:
      - default
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${KEYCLOAK_MEMORY_LIMIT:-1g}
    healthcheck:
      # The keycloak image has no wget/curl/nc and /bin/sh is bash, so a raw
      # /dev/tcp probe (bash builtin) is used here instead of wget.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${KC_HTTP_PORT:-8080}'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ============================================
  # Loki - Log Aggregation
  # ============================================
  # Every observability port below is published on 127.0.0.1 only: Prometheus, Loki, Tempo and
  # Grafana have no authentication of their own, so a bare `HOST:CONTAINER` mapping exposed them to
  # anything on the host's network (Prometheus could be stopped remotely, Loki accepted writes and
  # Tempo answered every stored trace). Loopback keeps them reachable for `deploy.sh health` and a
  # human on the host; containers reach each other by service name on the compose network, which
  # does not go through the published port at all.
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.8}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-loki
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      # Mounted from the repository, never copied into $VOLUMES_ROOT like prometheus.yml, tempo.yml
      # and the Grafana datasources: Loki's retention policy decides how much of the host disk the
      # logs may take and how much history survives, so it belongs in a reviewed commit. A host copy
      # (setup-env.sh never overwrites an existing one) is how it would drift out of review.
      - ./config/loki/loki.yml:/etc/loki/config.yml:ro
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/loki/data:/loki
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEMORY_LIMIT:-256m}
    # No healthcheck: this image is distroless (no shell, no wget), so an in-container probe
    # could never pass. deploy.sh health measures /ready from the host instead.
    restart: unless-stopped

  # ============================================
  # Prometheus - Metrics Collection
  # ============================================
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.0}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-prometheus
    user: "0:0"
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # --web.enable-lifecycle used to be here. It turns POST /-/quit and /-/reload on for whoever
      # can reach the port, and nothing in this repository calls either endpoint: a reload happens
      # by recreating the container. Re-adding the flag means deciding the exposure again.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/prometheus/config:/etc/prometheus:ro
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/prometheus/data:/prometheus
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================
  # Datastore exporters - PostgreSQL and Redis metrics
  # ============================================
  # Prometheus scraped only the two applications, so neither PostgreSQL instance nor Redis
  # exported anything: the datastores behind every endpoint were invisible. A pool exhaustion
  # or a Redis outage surfaced only as failed requests, and Redis is deliberately absent from
  # /actuator/health (management.health.redis.enabled=false), so a Redis outage appeared in no
  # signal at all. These exporters publish pg_up and redis_up plus the connection counters that
  # make saturation visible before the requests start failing.
  #
  # Two PostgreSQL exporters, not one: postgres_exporter measures one DSN per process, and both
  # instances have to report pg_up -- Keycloak's identity database and LifeControl's, on separate
  # instances with separate secrets. Multi-target mode would need a config file of its own for the
  # same signal.
  #
  # Host ports stay on 127.0.0.1 for the reason recorded above the Loki service: these endpoints
  # have no authentication. Prometheus scrapes them in-network by service name, so the published
  # mapping exists for a human with curl, not for the scrape.
  postgres-exporter-lifecontrol:
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.19.0}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-postgres-exporter-lifecontrol
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    environment:
      # The container-network name, never localhost: this exporter runs beside the database, so
      # `localhost:5432` would address its own container. sslmode=disable matches what the API
      # speaks on the in-network socket, which has no TLS.
      DATA_SOURCE_URI: "lifecontrol-postgres:5432/${LIFECONTROL_POSTGRES_DB:-lifecontrol}?sslmode=disable"
      DATA_SOURCE_USER: ${LIFECONTROL_POSTGRES_USER:-lifecontrol_user}
      # *_FILE, never DATA_SOURCE_PASS: the password is the same secret the database and the API
      # read, mounted read-only. As an environment value it would surface in `docker inspect` and
      # in `docker compose config`, which is the one place a secret must never be readable.
      DATA_SOURCE_PASS_FILE: /run/secrets/lifecontrol_postgres_password
    volumes:
      - ./secrets/lifecontrol_postgres_password:/run/secrets/lifecontrol_postgres_password:ro
    networks:
      - default
    depends_on:
      lifecontrol-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_EXPORTER_MEMORY_LIMIT:-128m}
    # No healthcheck: nothing gates on this container, and a dead exporter is already visible as
    # `up == 0` on the scrape target that consumes it, which is the signal it exists to provide.
    restart: unless-stopped

  postgres-exporter-keycloak:
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.19.0}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-postgres-exporter-keycloak
    ports:
      - "127.0.0.1:${KEYCLOAK_POSTGRES_EXPORTER_PORT:-9188}:9187"
    environment:
      DATA_SOURCE_URI: "keycloak-postgres:5432/${KEYCLOAK_POSTGRES_DB:-keycloak}?sslmode=disable"
      DATA_SOURCE_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      DATA_SOURCE_PASS_FILE: /run/secrets/keycloak_postgres_password
    volumes:
      - ./secrets/keycloak_postgres_password:/run/secrets/keycloak_postgres_password:ro
    networks:
      - default
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_EXPORTER_MEMORY_LIMIT:-128m}
    restart: unless-stopped

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.69.0}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-redis-exporter
    # The same address the API uses. This stack's Redis runs without --requirepass, so the
    # exporter authenticates with no credential at all, exactly like the API. When a password is
    # added it goes through --redis.password-file=/run/secrets/redis_password, never an environment
    # value, for the same reason the Postgres exporters use DATA_SOURCE_PASS_FILE.
    command: ["--redis.addr=redis://${REDIS_HOST:-redis}:${REDIS_INTERNAL_PORT:-6379}"]
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
    networks:
      - default
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${REDIS_EXPORTER_MEMORY_LIMIT:-128m}
    # No healthcheck: this image is distroless -- the pinned tag has no shell and no wget, measured
    # with `docker run --entrypoint /bin/sh` -- so an in-container probe could never pass. The
    # scrape is the readiness signal.
    restart: unless-stopped

  # ============================================
  # Tempo - Distributed Tracing
  # ============================================
  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:3.1.0}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-tempo
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3110}:3100" # Tempo
      - "127.0.0.1:${TEMPO_ZIPKIN_PORT:-9411}:9411" # Zipkin
    volumes:
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/tempo/config:/etc/tempo:ro
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/tempo/data:/var/tempo
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: ${TEMPO_MEMORY_LIMIT:-512m}
    # No healthcheck: this image is distroless (no shell, no wget), so an in-container probe
    # could never pass. deploy.sh health measures /ready from the host instead.
    restart: unless-stopped

  # ============================================
  # Grafana - Metrics Visualization
  # ============================================
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.4}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-grafana
    user: "1000:1000"
    entrypoint: ["/usr/local/bin/lc-grafana-entrypoint.sh"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./entrypoints/grafana-entrypoint.sh:/usr/local/bin/lc-grafana-entrypoint.sh:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/grafana/config:/etc/grafana/provisioning/datasources:ro
      # Unlike datasources.yml, the dashboards are mounted straight from the repository and never
      # installed into $VOLUMES_ROOT: setup-env.sh does not overwrite an existing host copy, so a
      # dashboard provisioned from the volume would keep whatever was installed first while the
      # repository moved on -- and a fresh staging/prod volume starts Grafana with none at all,
      # which is exactly the state this directory exists to end. The provider file sets
      # allowUiUpdates: false, so a commit is the only way to change a dashboard.
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/grafana/data:/var/lib/grafana
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-256m}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================
  # API Gateway - Spring Cloud Gateway
  # ============================================
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
      args:
        BUILD_PROFILE: ${SPRING_PROFILES_ACTIVE:-dev}
        APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "${API_GATEWAY_PORT:-9000}:${API_GATEWAY_SERVER_PORT:-9000}"
      - "${API_GATEWAY_MANAGEMENT_PORT:-9001}:${API_GATEWAY_MANAGEMENT_PORT:-9001}"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be set to dev, staging or prod}
      - SERVER_PORT=${API_GATEWAY_SERVER_PORT:-9000}
      - MANAGEMENT_PORT=${API_GATEWAY_MANAGEMENT_PORT:-9001}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-http://lifecontrol-dev-keycloak:8080/realms/life-control-realm}
      - LIFECONTROL_API_URI=${LIFECONTROL_API_URI:-http://lifecontrol-api:8082}
      - KEYCLOAK_INTERNAL_URI=${KEYCLOAK_INTERNAL_URI:-http://keycloak:8080/realms/life-control-realm}
      - LOKI_URL=${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-0.1}
      - OTLP_TRACING_ENDPOINT=${OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      - HEALTH_CHECK_ENABLED=${HEALTH_CHECK_ENABLED:-true}
      - HEALTH_CHECK_PATH=/actuator/health
      - CIRCUIT_BREAKER_ENABLED=${CIRCUIT_BREAKER_ENABLED:-true}
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-50}
      - TIMEOUT_DURATION=${TIMEOUT_DURATION:-3s}
      - RETRY_MAX_ATTEMPTS=${RETRY_MAX_ATTEMPTS:-3}
    networks:
      - default
    depends_on:
      keycloak:
        condition: service_healthy
      lifecontrol-api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${API_GATEWAY_MEMORY_LIMIT:-512m}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${API_GATEWAY_MANAGEMENT_PORT:-9001}/actuator/health || exit 1",
        ]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-3s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-60s}
    restart: unless-stopped

  # ============================================
  # Redis - Cache for LifeControl API
  # ============================================
  redis:
    image: ${REDIS_IMAGE:-redis:8.10-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-128mb}",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - ${VOLUMES_ROOT:?VOLUMES_ROOT must be set}/redis/data:/data
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================
  # LifeControl API - User Management API
  # ============================================
  lifecontrol-api:
    build:
      context: ../life-control-api
      dockerfile: Dockerfile
      args:
        BUILD_PROFILE: ${SPRING_PROFILES_ACTIVE:-dev}
        APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-lifecontrol-api
    entrypoint: ["/usr/local/bin/lc-app-entrypoint.sh"]
    ports:
      - "${LIFECONTROL_API_PORT:-8082}:${LIFECONTROL_API_PORT:-8082}"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be set to dev, staging or prod}
      - SERVER_PORT=${LIFECONTROL_API_PORT:-8082}
      - DATABASE_URL=${LIFECONTROL_DATABASE_URL:-jdbc:postgresql://lifecontrol-postgres:5432/lifecontrol}
      - DATABASE_USERNAME=${LIFECONTROL_DATABASE_USERNAME:-lifecontrol_user}
      - LOKI_URL=${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-0.1}
      - OTLP_TRACING_ENDPOINT=${OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      - HEALTH_CHECK_ENABLED=${HEALTH_CHECK_ENABLED:-true}
      - HEALTH_CHECK_PATH=/actuator/health
      - KEYCLOAK_ADMIN_SERVER_URL=${KEYCLOAK_ADMIN_SERVER_URL:-http://keycloak:8080}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-life-control-admin-client}
      - KEYCLOAK_URI=${KEYCLOAK_INTERNAL_URI:-http://keycloak:8080/realms/life-control-realm}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-http://localhost:8181/realms/life-control-realm}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:4200}
      # Access-provisioning worker: OFF in every environment by default. It mutates another
      # system with nobody watching, so switching it on is an explicit per-environment
      # operator decision made here, without rebuilding an image.
      - WORKER_ENABLED=${WORKER_ENABLED:-false}
      - WORKER_INTERVAL_SECONDS=${WORKER_INTERVAL_SECONDS:-60}
      - WORKER_MAX_ATTEMPTS=${WORKER_MAX_ATTEMPTS:-5}
      - WORKER_BATCH_SIZE=${WORKER_BATCH_SIZE:-20}
      - WORKER_BASE_DELAY_SECONDS=${WORKER_BASE_DELAY_SECONDS:-30}
      - WORKER_MAX_DELAY_SECONDS=${WORKER_MAX_DELAY_SECONDS:-3600}
      # How long a claimed RUNNING row may stay claimed before another tick treats it as
      # abandoned; it must stay above the worst real tick, or the worker could steal its own
      # live row and execute it twice.
      - WORKER_STALENESS_THRESHOLD_SECONDS=${WORKER_STALENESS_THRESHOLD_SECONDS:-900}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_INTERNAL_PORT:-6379}
    volumes:
      - ./entrypoints/lifecontrol-app-entrypoint.sh:/usr/local/bin/lc-app-entrypoint.sh:ro
      - ./secrets/lifecontrol_postgres_password:/run/secrets/lifecontrol_postgres_password:ro
      - ./secrets/keycloak_admin_client_secret:/run/secrets/keycloak_admin_client_secret:ro
    networks:
      - default
    depends_on:
      lifecontrol-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${LIFECONTROL_API_MEMORY_LIMIT:-512m}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${LIFECONTROL_API_PORT:-8082}/actuator/health || exit 1",
        ]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-3s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-60s}
    restart: unless-stopped

  # ============================================
  # Web App - Angular Frontend
  # ============================================
  web-app:
    build:
      context: ../life-control-app-angular
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${WEB_APP_IMAGE:-life-control-app-angular:latest}
    ports:
      - "${WEB_APP_PORT:-4200}:3000"
    environment:
      - NODE_ENV=production
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8181}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-life-control-realm}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-life-control-client}
      - API_GATEWAY_URL=${API_GATEWAY_URL:-http://localhost:9000}
      - API_BASE_PATH=${API_BASE_PATH:-/api}
    networks:
      - default
    depends_on:
      - api-gateway
      - keycloak
    healthcheck:
      # nginx en este image escucha IPv4 (listen 3000) y el DNS del contenedor
      # resuelve "localhost" a ::1, así que la probe debe usar 127.0.0.1.
      # BusyBox wget soporta --spider (existe el endpoint) y no bumpea nginx.
      test:
        [
