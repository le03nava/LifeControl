# ============================================
# Docker Compose Override - Development
# ============================================
# Automatically loaded for the dev environment (see _common.sh resolve_compose_env).
# Holds dev-only settings that differ from the base compose. Stable container
# names for scaled-able services (keycloak/api-gateway/web-app) live HERE, not
# in base, because prod sets deploy.replicas on them and compose v2 rejects
# container_name + replicas together.

services:
  # ============================================
  # Development API Gateway Overrides
  # ============================================
  api-gateway:
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-api-gateway
    environment:
      - LOG_LEVEL=DEBUG
      - TRACING_SAMPLING_PROBABILITY=0.5
      - ACTUATOR_ENDPOINTS=*
      - HEALTH_CHECK_INTERVAL=15s
    volumes:
      - ../api-gateway/src/main/resources:/app/resources:ro

  # ============================================
  # Development Keycloak Overrides
  # ============================================
  keycloak:
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-keycloak

  # ============================================
  # Development Grafana Overrides
  # ============================================
  grafana:
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true

  # ============================================
  # Development Web App (Angular) Override
  # ============================================
  web-app:
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-life-control-app-angular

  # ============================================
  # Development LifeControl API Override
  # ============================================
  # The access-provisioning worker runs ON by default in dev, and only here. Dev is the one
  # environment whose data is disposable and whose mail lands in Mailpit (SMTP_HOST=mailpit,
  # see .env.template), so leaving the worker off has no upside there: with it off, a
  # provisioning task is enqueued and never applied, which is exactly the state that made a
  # PENDING access request look like a request that would advance on its own. It stays OFF in
  # the base compose and in staging/prod, because it mutates another system (Keycloak) with
  # nobody watching, so switching it on there stays an explicit operator decision.
  # A dev env file that declares WORKER_ENABLED wins over this default in either direction.
  lifecontrol-api:
    environment:
      - WORKER_ENABLED=${WORKER_ENABLED:-true}

  # ============================================
  # Development Mailpit - invitation email sink
  # ============================================
  # Dev-only: it lives in this override (dev), never in the base compose or in
  # docker-compose.prod.yml. Keycloak relays the realm's action emails here
  # (SMTP_HOST=mailpit, see .env.template). The UI/API is published on
  # MAILPIT_PORT; the SMTP port (1025) is deliberately NOT published to the
  # host because only the compose network needs it. No explicit healthcheck:
  # the image ships HEALTHCHECK /mailpit readyz.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31.6}
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - default
    restart: unless-stopped
