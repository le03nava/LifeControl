# ============================================
# Docker Compose Override - Development
# ============================================
# Automatically loaded when running: docker-compose up
# Use: docker-compose up (override applied automatically)

services:
  # ============================================
  # Development API Gateway Overrides
  # ============================================
  api-gateway:
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-api-gateway
    environment:
      - LOG_LEVEL=DEBUG
      - TRACING_SAMPLING_PROBABILITY=0.5
      - ACTUATOR_ENDPOINTS=*
      - HEALTH_CHECK_INTERVAL=15s
    volumes:
      - ../api-gateway/src/main/resources:/app/resources:ro

  # ============================================
  # Development Keycloak Overrides
  # ============================================
  keycloak:
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=dev_admin_pass

  # ============================================
  # Development Monitoring Overrides
  # ============================================
  grafana:
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ALLOW_EMBEDDING=true

  # ============================================
  # Development Redis Overrides
  # ============================================
  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-redis

  # ============================================
  # Development Web App (Angular) Override
  # ============================================
  web-app:
    container_name: ${COMPOSE_PROJECT_NAME:-lifecontrol}-life-control-app-angular
