# ============================================
# API Gateway - Configuración Desarrollo
# ============================================

# Configuración de Servicios Locales
KEYCLOAK_ISSUER_URI=http://localhost:8181/realms/life-control-realm

# Puertos
SERVER_PORT=9000
MANAGEMENT_PORT=9000

# Logging más verboso para desarrollo
LOG_LEVEL=DEBUG
SPRING_PROFILES_ACTIVE=dev

# Circuit Breaker más sensible para desarrollo
CIRCUIT_BREAKER_FAILURE_THRESHOLD=30
CIRCUIT_BREAKER_WINDOW_SIZE=5
TIMEOUT_DURATION=2s
RETRY_MAX_ATTEMPTS=2

# Tracing habilitado pero con baja frecuencia
TRACING_ENABLED=true
TRACING_SAMPLING_PROBABILITY=0.1

# Loki local
LOKI_URL=http://localhost:3100/loki/api/v1/push

# Health checks
HEALTH_CHECK_ENABLED=true
HEALTH_CHECK_PATH=/actuator/health