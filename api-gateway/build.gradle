plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.spring.dependency.management)
	alias(libs.plugins.spotless)
	alias(libs.plugins.spotbugs)
}

group = 'com.lifecontrol'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// The same formatting gate as `life-control-api` (issue #894, S6), with the same formatter and the
// same shape: the default target is every Java source of the module, so a file added tomorrow is
// formatted rather than silently skipped, and no source set is excluded.
spotless {
	java {
		palantirJavaFormat(libs.versions.palantir.java.format.get())
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

spotbugs {
	toolVersion = libs.versions.spotbugs.tool.get()
	effort.set(com.github.spotbugs.snom.Effort.MAX)
	reportLevel.set(com.github.spotbugs.snom.Confidence.valueOf('MEDIUM'))
	ignoreFailures = false
	excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		xml.required = true
		html.required = true
	}
}

// Static analysis is scoped to production code: test sources are intentionally noisy
// (dead stores, unread fields, format strings) and out of this baseline's scope.
tasks.named('spotbugsTest') {
	enabled = false
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation libs.springdoc.openapi.starter.webmvc.ui
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation libs.loki.logback.appender
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation libs.springdoc.openapi.starter.webmvc.api
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		// Spring Cloud's BOM is the only BOM this build imports, so its version is the catalog's
		// `spring-cloud` entry. `mavenBom` takes a String notation and nothing else — a catalog
		// accessor is a dependency, not a notation — which is why the entry is stringified here
		// instead of the coordinate being typed back into this file.
		mavenBom libs.spring.cloud.dependencies.get().toString()
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
