# ============================================
# nginx.conf - LifeControl Angular App
# Static SPA serving, non-root (pid/temp en /tmp)
# ============================================

worker_processes auto;
# Non-root: el PID default (/var/run/nginx.pid) no es escribible por USER 1000:1000
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # --- gzip ---
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss image/svg+xml;

  server {
    # Non-root: no puede bindear el 80; usa 3000 (mismo puerto que exponía bun)
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (CSP NO va acá: lo gestiona el meta tag + nonce del entrypoint) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # index.html: revalida siempre (para que CSP/env cambien sin purga de cache).
    # Usa `expires` (no add_header) para no romper la herencia de los security headers.
    location = /index.html {
      expires -1;
      try_files $uri =404;
    }

    # env.js es generado en runtime: nunca cachear
    location = /assets/env.js {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    # Bundles hasheados + fuentes: cache inmutable
    location ~* \.(js|css|woff2?|ttf|otf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Healthcheck
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok";
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
