<div class="store-zones-edit-page">
  <app-page-header
    [title]="isEditMode() ? 'Editar Zona' : 'Nueva Zona'"
    subtitle="Zonas físicas del área seleccionada"
    [showActions]="false"
  />

  @if (generalError(); as errorMsg) {
    <app-error-banner [message]="errorMsg" [autoScroll]="true" />
  }

  <app-store-zone-form
    [storeZone]="storeZone()"
    [serverErrors]="serverErrors()"
    [saving]="saving()"
    [canWrite]="canWrite"
    (save)="onSave($event)"
    (cancelForm)="onCancel()"
  />
</div>
