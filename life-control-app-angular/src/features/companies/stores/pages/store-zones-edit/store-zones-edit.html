<div class="store-zones-edit-page">
  <app-page-header
    [title]="isEditMode() ? 'Editar Zona' : 'Nueva Zona'"
    subtitle="Zonas físicas del área seleccionada"
    [showActions]="false"
  />

  <app-error-banner [message]="generalError()" />

  <app-store-zone-form
    [storeZone]="storeZone()"
    [serverErrors]="serverErrors()"
    (save)="onSave($event)"
    (cancelForm)="onCancel()"
  />
</div>
