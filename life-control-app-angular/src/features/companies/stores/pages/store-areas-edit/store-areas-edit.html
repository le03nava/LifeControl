<div class="store-areas-edit-page">
  <app-page-header
    [title]="isEditMode() ? 'Editar Área' : 'Nueva Área'"
    subtitle="Áreas físicas de la tienda seleccionada"
    [showActions]="false"
  />

  <app-error-banner [message]="generalError()" />

  <app-store-area-form
    [area]="area()"
    [serverErrors]="serverErrors()"
    [saving]="saving()"
    [canWrite]="canWrite"
    (save)="onSave($event)"
    (cancelForm)="onCancel()"
  />
</div>
