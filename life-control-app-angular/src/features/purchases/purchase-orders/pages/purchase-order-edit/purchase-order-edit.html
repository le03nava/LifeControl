<div class="purchase-order-edit-page">
  <app-page-header [title]="headerTitle()" [subtitle]="headerSubtitle()">
    <div class="header-tools">
      @if (loadedOrder(); as order) {
        <app-status-chip [statusName]="order.statusName" />
        @if (isOrderReceivable(order.statusName) && order.enabled) {
          <button
            mat-flat-button
            color="primary"
            [routerLink]="['/purchases/receipts/create']"
            [queryParams]="{ purchaseOrderId: order.id }"
          >
            <mat-icon fontIcon="inventory_2" /> Recibir mercadería
          </button>
        }
      }
      <button mat-stroked-button routerLink="/purchases/orders">
        <mat-icon fontIcon="arrow_back" /> Volver
      </button>
    </div>
  </app-page-header>

  <!-- General Error -->
  @if (generalError(); as errorMessage) {
    <app-error-banner [message]="errorMessage" />
  }

  <!-- Status stepper (edit mode only) -->
  @if (loadedOrder(); as order) {
    <mat-card appearance="outlined" class="status-card">
      <mat-card-content>
        <app-status-selector [order]="order" (statusChanged)="onStatusChanged($event)" />
      </mat-card-content>
    </mat-card>
  }

  <form [formGroup]="headerForm()" (ngSubmit)="onSave()" novalidate>
    <!-- Company Information (cascade + detail card) -->
    <!-- `(storeResolved)` is the silent-patch channel: the cascade patches
         `companyStoreId` with `emitEvent: false`, so its `valueChanges` never
         fires for the profile prefill or the cascade resets. -->
    <app-company-info-section
      [headerForm]="headerForm()"
      [isEditMode]="isEditMode()"
      [loadedOrder]="loadedOrder()"
      [serverErrors]="serverErrors()"
      (storeResolved)="onStoreResolved($event)"
    />

    <!-- Supplier Information (supplier + payment method + comments) -->
    <app-supplier-info-section
      [headerForm]="headerForm()"
      [isEditMode]="isEditMode()"
      [loadedOrder]="loadedOrder()"
      [serverErrors]="serverErrors()"
    />

    <!-- Line Items Table -->
    <app-detail-table
      [items]="lineItems()"
      [isDraft]="isDraft()"
      [availableProducts]="supplierProducts()"
      [storeId]="variantStoreId()"
      [showReceiptProgress]="!!loadedOrder()"
      (itemsChanged)="onItemsChanged($event)"
    />

    <!-- Sticky action bar -->
    <div class="form-actions">
      <div class="actions-summary">
        <span class="summary-label">Total</span>
        <span class="summary-total">{{ orderTotal() | currency: 'MXN' }}</span>
      </div>
      <div class="actions-buttons">
        <button
          mat-stroked-button
          type="button"
          (click)="onCancel()"
          [disabled]="saving()"
          aria-label="Cancelar"
        >
          Cancelar
        </button>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="saving() || headerForm().invalid || !lineItemsValid()"
          aria-label="Guardar orden"
        >
          @if (saving()) {
            <mat-icon fontIcon="hourglass_empty" />
          } @else {
            <mat-icon fontIcon="save" />
          }
          {{ saving() ? 'Guardando...' : isEditMode() ? 'Actualizar Orden' : 'Crear Orden' }}
        </button>
      </div>
    </div>
  </form>
</div>
