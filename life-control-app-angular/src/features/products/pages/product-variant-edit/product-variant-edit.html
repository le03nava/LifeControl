<app-page-header [title]="product()?.name ?? 'Variante'" [subtitle]="headerSubtitle()">
  @if (loadedVariant()) {
    <button mat-flat-button color="primary" (click)="openDefinitionDialog()">
      <mat-icon>edit</mat-icon>
      Editar la definición
    </button>
  }
</app-page-header>

@if (productResource.error(); as err) {
  <app-error-banner [message]="httpErrorMessage(err)" />
}

@if (generalError(); as errorMessage) {
  <app-error-banner [message]="errorMessage" />
}

<!--
  Per-store stock and prices. The row hangs off a variant that has to exist, and
  only once the stored barcode is known, because that is what keys the row read.
-->
@if (variantId(); as id) {
  @if (loadedBarCode(); as barcode) {
    <app-product-variant-store-stock
      [variantId]="id"
      [barCode]="barcode"
      (dirtyChange)="onStoreStockDirtyChange($event)"
    />
  }
}
