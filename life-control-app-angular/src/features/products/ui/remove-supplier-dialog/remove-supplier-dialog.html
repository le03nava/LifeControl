<h2 mat-dialog-title>Eliminar la asignación del proveedor</h2>
<mat-dialog-content>
  <p>
    ¿Estás seguro que querés eliminar la asignación de
    <strong>{{ data.supplierName }}</strong
    >?
  </p>
  <p class="warning-text">Esta acción no se puede deshacer.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="warn" [mat-dialog-close]="true">Eliminar</button>
</mat-dialog-actions>
