<h2 mat-dialog-title>
  @if (editMode()) {
    Editar la definición de la variante
  } @else {
    Agregar una variante al producto
  }
</h2>

@if (generalError(); as errorMessage) {
  <app-error-banner [message]="errorMessage" />
}

@if (discardNotice(); as notice) {
  <p class="discard-notice">{{ notice }}</p>
}

<app-product-variant-form
  [formGroup]="definitionForm()"
  [serverErrors]="serverErrors()"
  [editMode]="editMode()"
  [saving]="saving()"
  [measureUnits]="measureUnits()"
  [attributeForm]="attributeForm()"
  [attributeDefinitions]="variantDefinitions()"
  [attributeProfileKnown]="profileKnown()"
  (saveVariant)="onSaveVariant($event)"
  (saveVariantAndContinue)="onSaveVariantAndContinue($event)"
  (cancelForm)="cancel()"
/>
